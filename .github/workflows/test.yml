name: Test

"on":
  workflow_dispatch:

# Builds every platform on the runner that can build it, publishes the
# artifacts to Maven Local (mirroring sdl-kmp's test workflow: the artifacts
# are signed with the repository's PGP key) and runs the tests plus the
# example app headless:
#
#   macOS ARM64 -> :sdl-mixer-kmp metadata + jvm + all Apple target klibs
#                  (macos/ios/tvos, each with the embedded SDL_mixer static
#                  library) and the :mixer-jni-jvm-darwin-* JNI artifacts;
#                  JVM + macosArm64 tests; example (JVM + native, headless)
#   Linux x64   -> :sdl-mixer-kmp linuxX64 klib and the cross-compiled
#                  linuxArm64/mingwX64 klibs (with the embedded static
#                  library) and the :mixer-jni-jvm-linux-* JNI artifacts;
#                  JVM + linuxX64 tests; example (native, headless)
#   Android x64 -> the four androidNative klibs (with the embedded static
#                  library built via the Android NDK)
#   Windows x64 -> the windows-x86_64 JNI artifact (native MinGW build) and
#                  JVM tests
#
# Use this workflow to verify a change end-to-end before publishing; the
# publish.yml workflow performs the actual Maven Central release.
#
# Trigger: run manually via the Actions tab.

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-macos:
    name: Test macOS ARM64
    runs-on: macos-14
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Configure JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          # The SDL/SDL_mixer submodules ship their own wrapper jars, which are
          # not part of the action's known-good checksum list.
          validate-wrappers: false

      - name: Decode signing key
        run: |
          echo "${{ secrets.SIGNING_KEY }}" | tr -d ' \n' | base64 -d > "$RUNNER_TEMP/signing-key.gpg"
          ls -la "$RUNNER_TEMP/signing-key.gpg"
          head -c 16 "$RUNNER_TEMP/signing-key.gpg" | od -c | head -2

      - name: Publish all platforms to Maven Local
        run: >
          ./gradlew --no-daemon --rerun-tasks --stacktrace
          -Psigning.keyId="${{ secrets.SIGNING_KEY_ID }}"
          -Psigning.secretKeyRingFile="${{ runner.temp }}/signing-key.gpg"
          -Psigning.password="${{ secrets.SIGNING_PASSWORD }}"
          :sdl-mixer-kmp:publishToMavenLocal
          :mixer-jni-jvm-darwin-aarch64:publishToMavenLocal
          :mixer-jni-jvm-darwin-x86_64:publishToMavenLocal

      - name: Run JVM tests
        run: ./gradlew --no-daemon :sdl-mixer-kmp:jvmTest

      - name: Run native tests (macosArm64)
        run: ./gradlew --no-daemon :sdl-mixer-kmp:macosArm64Test

      - name: Run example (JVM, headless)
        run: >
          SDL_VIDEO_DRIVER=dummy ./gradlew --no-daemon
          :examples:mixer_device:jvmRun --args=""

      - name: Run example (macosArm64, headless)
        run: >
          SDL_VIDEO_DRIVER=dummy ./gradlew --no-daemon
          :examples:mixer_device:runDebugExecutableMacosArm64

  test-linux:
    name: Test Linux x64
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Configure JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libx11-dev libxext-dev libxcursor-dev libxi-dev libxfixes-dev \
            libxrandr-dev libxrender-dev libxss-dev libxtst-dev \
            libwayland-dev libwayland-bin libxkbcommon-dev libegl-dev libdecor-0-dev \
            libpipewire-0.3-dev libpulse-dev libasound2-dev \
            gcc-mingw-w64-x86-64 g++-mingw-w64-x86-64 \
            gcc-aarch64-linux-gnu g++-aarch64-linux-gnu

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          # The SDL/SDL_mixer submodules ship their own wrapper jars, which are
          # not part of the action's known-good checksum list.
          validate-wrappers: false

      - name: Decode signing key
        run: |
          echo "${{ secrets.SIGNING_KEY }}" | tr -d ' \n' | base64 -d > "$RUNNER_TEMP/signing-key.gpg"
          ls -la "$RUNNER_TEMP/signing-key.gpg"
          head -c 16 "$RUNNER_TEMP/signing-key.gpg" | od -c | head -2

      - name: Publish linuxX64/linuxArm64/mingwX64 klibs and the linux JNI artifacts to Maven Local
        run: >
          ./gradlew --no-daemon --rerun-tasks --stacktrace
          -Psigning.keyId="${{ secrets.SIGNING_KEY_ID }}"
          -Psigning.secretKeyRingFile="${{ runner.temp }}/signing-key.gpg"
          -Psigning.password="${{ secrets.SIGNING_PASSWORD }}"
          :sdl-mixer-kmp:publishKotlinMultiplatformPublicationToMavenLocal
          :sdl-mixer-kmp:publishLinuxX64PublicationToMavenLocal
          :sdl-mixer-kmp:publishLinuxArm64PublicationToMavenLocal
          :sdl-mixer-kmp:publishMingwX64PublicationToMavenLocal
          # The windows-x86_64 JNI artifact is built and published by the
          # test-windows job below, not cross-compiled here.
          :mixer-jni-jvm-linux-x86_64:publishToMavenLocal
          :mixer-jni-jvm-linux-aarch64:publishToMavenLocal

      - name: Run JVM tests
        run: ./gradlew --no-daemon :sdl-mixer-kmp:jvmTest

      - name: Run native tests (linuxX64)
        run: ./gradlew --no-daemon :sdl-mixer-kmp:linuxX64Test

      - name: Run example (linuxX64, headless)
        run: >
          SDL_VIDEO_DRIVER=dummy ./gradlew --no-daemon
          :examples:mixer_device:runDebugExecutableLinuxX64

  test-android:
    name: Test Android (androidNative klibs)
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Configure JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      # The androidNative klibs embed the SDL_mixer static library, which is
      # cross-compiled with the Android NDK.
      - name: Install Android NDK
        run: |
          yes | ${ANDROID_SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager --install "ndk;27.0.12077973" >/dev/null

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          # The SDL/SDL_mixer submodules ship their own wrapper jars, which are
          # not part of the action's known-good checksum list.
          validate-wrappers: false

      - name: Build androidNative klibs
        run: >
          ./gradlew --no-daemon --stacktrace
          :sdl-mixer-kmp:compileKotlinAndroidNativeArm64
          :sdl-mixer-kmp:compileKotlinAndroidNativeArm32
          :sdl-mixer-kmp:compileKotlinAndroidNativeX64
          :sdl-mixer-kmp:compileKotlinAndroidNativeX86

  test-windows:
    name: Test Windows x64
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Configure JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Install CMake
        shell: pwsh
        run: |
          choco install cmake -y --no-progress
          # cmake.exe may not be on PATH for the Gradle daemon.
          echo "C:\Program Files\CMake\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Install MinGW
        shell: pwsh
        run: |
          choco install mingw -y --no-progress
          # The JVM needs MinGW's runtime DLLs (libwinpthread-1.dll,
          # libgcc_s_seh-1.dll) on PATH to load the JNI DLL.
          echo "C:\ProgramData\chocolatey\lib\mingw\tools\install\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          # The SDL/SDL_mixer submodules ship their own wrapper jars, which are
          # not part of the action's known-good checksum list.
          validate-wrappers: false

      - name: Decode signing key
        shell: pwsh
        run: |
          [IO.File]::WriteAllBytes(
            "$env:RUNNER_TEMP\signing-key.gpg",
            [Convert]::FromBase64String("${{ secrets.SIGNING_KEY }}")
          )
          Get-Item "$env:RUNNER_TEMP\signing-key.gpg" | Select-Object Length

      - name: Publish windows JNI to Maven Local
        shell: cmd
        run: >
          ./gradlew --no-daemon --stacktrace
          -Psigning.keyId="${{ secrets.SIGNING_KEY_ID }}"
          -Psigning.secretKeyRingFile="${{ runner.temp }}\signing-key.gpg"
          -Psigning.password="${{ secrets.SIGNING_PASSWORD }}"
          :mixer-jni-jvm-windows-x86_64:publishToMavenLocal

      - name: Run JVM tests
        run: ./gradlew --no-daemon --stacktrace :sdl-mixer-kmp:jvmTest

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports-windows
          path: sdl-mixer-kmp/build/reports/tests
          if-no-files-found: ignore

